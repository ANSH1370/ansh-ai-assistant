# Keeps the Render free-tier instance from sleeping (it spins down after
# 15 min idle and takes 30-50 s to wake — long enough for a visitor's first
# question to time out). Pings the portfolio's warmup route, which pings
# this backend's /health. Free on a public repo; on a private repo it
# consumes GitHub Actions minutes, so use cron-job.org / UptimeRobot instead.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -sS -m 30 -o /dev/null -w "warmup HTTP %{http_code} in %{time_total}s\n" https://anshmangukiya.vercel.app/api/chat || true
